server.port=${PORT:8080}
server.error.include-message=always

# ---- MySQL (override with env vars in production) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resolveai}
spring.datasource.username=root
spring.datasource.password=Ameer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ---- JWT / CORS ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-32chars-min}
app.jwt.expiry-ms=86400000
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://*.onrender.com}

# ---- Spring AI (any OpenAI-compatible API: OpenAI, Groq, OpenRouter, Gemini-compat...) ----
spring.ai.openai.api-key=${AI_API_KEY:demo-key}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3
